[package]
name = "qbank-studio"
version = "0.3.0-beta.1"
description = "Modern QBank Studio presentation adapter"
authors = ["QBank Studio contributors"]
edition = "2021"

[lib]
name = "qbank_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.10.2", features = [] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-shell = "2.3.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
