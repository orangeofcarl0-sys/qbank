[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "qbank"
version = "0.1.0"
description = "A transparent, local-first Markdown question bank CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "qbank contributors" }]
dependencies = [
  "click>=8.2,<9",
  "jinja2>=3.1,<4",
  "markdown-it-py>=3.0,<5",
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  "ruamel.yaml>=0.18,<0.19",
  "typer>=0.27,<1",
]

[project.optional-dependencies]
desktop = [
  "PySide6>=6.8,<7",
  "QtAwesome>=1.4,<2",
]
dev = [
  "deptry>=0.23,<1",
  "hatchling>=1.25,<2",
  "import-linter>=2.8,<3",
  "pip-audit>=2.9,<3",
  "mypy>=1.11,<2",
  "pytest>=8.2,<10",
  "pytest-cov>=5.0,<8",
  "pyright>=1.1,<2",
  "ruff>=0.6,<1",
]
studio-dev = [
  "pytest-qt>=4.4,<5",
  "QtAwesome>=1.4,<2",
  "PySide6>=6.8,<7",
]

[project.scripts]
qbank = "qbank.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qbank"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["qbank"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
]
ignore = ["E501", "RUF001"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-statements = 40

[tool.ruff.lint.per-file-ignores]
"src/qbank/commands/*.py" = ["PLR0913"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src/qbank"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"

[[tool.mypy.overrides]]
# Qt for Python does not publish a PEP 561 marker; keep this exception scoped to Qt.
module = ["PySide6", "PySide6.*"]
ignore_missing_imports = true

[tool.deptry]
known_first_party = ["qbank"]
optional_dependencies_dev_groups = ["dev", "studio-dev"]
package_module_name_map = { PySide6 = ["PySide6"] }

[tool.importlinter]
root_package = "qbank"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent from outer layers and runtime adapters"
type = "forbidden"
source_modules = ["qbank.domain", "qbank.models", "qbank.question_layout"]
forbidden_modules = [
  "qbank.application",
  "qbank.infrastructure",
  "qbank.bootstrap",
  "qbank.commands",
  "qbank.cli",
  "typer",
  "rich",
  "sqlite3",
]

[[tool.importlinter.contracts]]
name = "Application does not depend on presentation or concrete infrastructure"
type = "forbidden"
source_modules = ["qbank.application"]
forbidden_modules = [
  "qbank.presentation",
  "qbank.desktop",
  "qbank.bootstrap",
  "qbank.commands",
  "qbank.cli",
  "qbank.repository",
  "qbank.search_index",
  "qbank.storage",
  "sqlite3",
  "typer",
  "rich",
]

[[tool.importlinter.contracts]]
name = "Studio presentation does not depend on storage, CLI, or infrastructure adapters"
type = "forbidden"
source_modules = ["qbank.presentation"]
forbidden_modules = [
  "qbank.infrastructure",
  "qbank.repository",
  "qbank.search_index",
  "qbank.storage",
  "qbank.commands",
  "qbank.cli",
  "sqlite3",
  "typer",
  "rich",
]

[[tool.importlinter.contracts]]
name = "CLI commands do not access Markdown or SQLite adapters directly"
type = "forbidden"
source_modules = ["qbank.commands"]
allow_indirect_imports = true
forbidden_modules = [
  "qbank.repository",
  "qbank.search_index",
  "qbank.storage",
  "sqlite3",
]

[[tool.importlinter.contracts]]
name = "Exporters do not query repositories or indexes"
type = "forbidden"
source_modules = ["qbank.exporters"]
allow_indirect_imports = true
forbidden_modules = ["qbank.repository", "qbank.search_index", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Infrastructure adapters do not depend on presentation"
type = "forbidden"
source_modules = ["qbank.infrastructure"]
forbidden_modules = ["qbank.commands", "qbank.cli", "typer", "rich"]

[[tool.importlinter.contracts]]
name = "Application, domain, and presentation follow inward dependencies"
type = "layers"
layers = [
  "qbank.commands",
  "qbank.application",
  "qbank.domain",
]

[[tool.importlinter.contracts]]
name = "Presentation command groups remain independent"
type = "independence"
modules = [
  "qbank.commands.assets",
  "qbank.commands.artifacts",
  "qbank.commands.project",
  "qbank.commands.questions",
  "qbank.commands.codex",
]
