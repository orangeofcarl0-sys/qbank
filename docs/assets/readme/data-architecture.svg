<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">qbank 项目结构与数据边界</title>
  <desc id="desc">用户、脚本和 coding agent 通过 Studio、CLI 或本地 STDIO MCP 进入同一个 qbank 应用核心。Skill 只提供操作指引，不直接访问题库。应用核心在题库根目录内管理权威文件，并生成可重建的索引、预览和导出产物。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="context-stroke"/>
    </marker>
    <style>
      .bg{fill:#f6f7f5}.surface{fill:#fff;stroke:#cbd3da;stroke-width:1.5}.entry{fill:#e7f0f7;stroke:#7596b0;stroke-width:1.6}.core{fill:#dfeaf3;stroke:#668ba8;stroke-width:1.9}.authority{fill:#e8f1eb;stroke:#73917c;stroke-width:1.7}.derived{fill:#f0f2f4;stroke:#a8b2bb;stroke-width:1.4}.guide{fill:#fff4dc;stroke:#b58b48;stroke-width:1.5;stroke-dasharray:6 4}.legacy{fill:none;stroke:#9ba6af;stroke-width:1.4;stroke-dasharray:6 4}.boundary{fill:none;stroke:#73917c;stroke-width:2}.line{fill:none;stroke:#70899c;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}.title{fill:#25313b;font:700 27px 'Segoe UI',sans-serif}.heading{fill:#25313b;font:600 17px 'Segoe UI',sans-serif}.body{fill:#4d5c68;font:14px 'Segoe UI',sans-serif}.small{fill:#687682;font:12px 'Segoe UI',sans-serif}.label{fill:#315d7e;font:600 13px 'Segoe UI',sans-serif}
      @media(prefers-color-scheme:dark){.bg{fill:#1e242a}.surface{fill:#282f36;stroke:#46515b}.entry{fill:#293d4c;stroke:#739bb8}.core{fill:#29475c;stroke:#80a8c4}.authority{fill:#293c32;stroke:#79a087}.derived{fill:#252c32;stroke:#4c5862}.guide{fill:#3d3526;stroke:#c09a58}.legacy{stroke:#697680}.boundary{stroke:#79a087}.line{stroke:#7f9bb1}.title,.heading{fill:#edf1f4}.body{fill:#c4cdd5}.small{fill:#a2aeb8}.label{fill:#9cc3df}}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="18"/>
  <text class="title" x="48" y="50">一个业务核心，多个入口，一套题库文件</text>
  <text class="body" x="48" y="77">入口只负责交互和协议转换；题目规则、校验、事务、历史与索引策略只在共享核心中实现一次。</text>

  <text class="label" x="48" y="112">1 · 使用者与自动化</text>
  <rect class="surface" x="48" y="126" width="214" height="54" rx="9"/>
  <text class="heading" x="68" y="151">题库维护者</text><text class="small" x="68" y="169">浏览、编辑、审阅与发布</text>
  <rect class="surface" x="282" y="126" width="214" height="54" rx="9"/>
  <text class="heading" x="302" y="151">脚本与 CI</text><text class="small" x="302" y="169">批处理、校验与构建</text>
  <rect class="surface" x="516" y="126" width="214" height="54" rx="9"/>
  <text class="heading" x="536" y="151">coding agent</text><text class="small" x="536" y="169">语义判断与任务编排</text>
  <rect class="guide" x="750" y="126" width="402" height="54" rx="9"/>
  <text class="heading" x="770" y="151">AGENTS.md + $qbank / $qbank-digitize</text>
  <text class="small" x="770" y="169">操作指引、授权与交接；不直接读写题库</text>

  <path class="line" d="M155 180V214H180"/>
  <path class="line" d="M389 180V214H426"/>
  <path class="line" d="M623 180V199H672V214"/>
  <path class="line dash" d="M951 180V199H672V214"/>

  <text class="label" x="48" y="211">2 · 表现层与协议适配器</text>
  <rect class="entry" x="48" y="226" width="250" height="84" rx="10"/>
  <text class="heading" x="68" y="252">QBank Studio</text>
  <text class="small" x="68" y="274">apps/studio/ → Protocol 1.0</text>
  <text class="small" x="68" y="293">qbank.studio_sidecar</text>
  <rect class="entry" x="318" y="226" width="216" height="84" rx="10"/>
  <text class="heading" x="338" y="252">CLI</text>
  <text class="small" x="338" y="274">src/qbank/commands/</text>
  <text class="small" x="338" y="293">稳定 JSON / 人类输出</text>
  <rect class="entry" x="554" y="226" width="236" height="84" rx="10"/>
  <text class="heading" x="574" y="252">本地 STDIO MCP</text>
  <text class="small" x="574" y="274">src/qbank/mcp/</text>
  <text class="small" x="574" y="293">读取工具 + prepare/commit</text>
  <rect class="legacy" x="810" y="226" width="342" height="84" rx="10"/>
  <text class="heading" x="830" y="252">QBank Studio Legacy</text>
  <text class="small" x="830" y="274">qbank.legacy_qt</text>
  <text class="small" x="830" y="293">仅保留严重兼容、安全和数据修复</text>

  <path class="line" d="M173 310V340"/>
  <path class="line" d="M426 310V340"/>
  <path class="line" d="M672 310V340"/>
  <path class="line" d="M981 310V340"/>

  <text class="label" x="48" y="337">3 · 共享业务核心（src/qbank/）</text>
  <rect class="core" x="48" y="352" width="1104" height="130" rx="12"/>
  <text class="heading" x="72" y="382">bootstrap / application services / domain models</text>
  <rect class="surface" x="72" y="399" width="238" height="58" rx="8"/>
  <text class="heading" x="90" y="425">项目与仓储</text><text class="small" x="90" y="445">Context · snapshot · containment</text>
  <rect class="surface" x="326" y="399" width="238" height="58" rx="8"/>
  <text class="heading" x="344" y="425">规则与查询</text><text class="small" x="344" y="445">Schema · validation · search</text>
  <rect class="surface" x="580" y="399" width="252" height="58" rx="8"/>
  <text class="heading" x="598" y="425">安全写入</text><text class="small" x="598" y="445">dry-run · revision · lock · rollback</text>
  <rect class="surface" x="848" y="399" width="280" height="58" rx="8"/>
  <text class="heading" x="866" y="425">渲染与资产</text><text class="small" x="866" y="445">Markdown · MathJax · Pandoc · Ipe</text>

  <path class="line" d="M600 482V510"/>
  <text class="label" x="48" y="507">4 · 题库根目录内的数据边界</text>
  <rect class="boundary" x="48" y="522" width="1104" height="190" rx="12"/>
  <text class="heading" x="72" y="550">权威文件 · 可审查、可备份、可由 Git 管理</text>
  <rect class="authority" x="72" y="566" width="185" height="70" rx="8"/>
  <text class="heading" x="90" y="593">qbank.yaml</text><text class="small" x="90" y="615">项目配置与受管路径</text>
  <rect class="authority" x="273" y="566" width="203" height="70" rx="8"/>
  <text class="heading" x="291" y="593">questions/**/*.md</text><text class="small" x="291" y="615">题目、答案、解析、来源</text>
  <rect class="authority" x="492" y="566" width="194" height="70" rx="8"/>
  <text class="heading" x="510" y="593">assets/</text><text class="small" x="510" y="615">文件、manifest、多表示</text>
  <rect class="authority" x="702" y="566" width="210" height="70" rx="8"/>
  <text class="heading" x="720" y="593">项目定义</text><text class="small" x="720" y="615">taxonomy · views · papers</text>
  <rect class="authority" x="928" y="566" width="200" height="70" rx="8"/>
  <text class="heading" x="946" y="593">.qbank/history/</text><text class="small" x="946" y="615">与权威写入共同提交</text>

  <text class="heading" x="72" y="674">可重建或可重新生成</text>
  <rect class="derived" x="273" y="650" width="203" height="42" rx="7"/>
  <text class="small" x="291" y="676">.qbank/index.sqlite</text>
  <rect class="derived" x="492" y="650" width="194" height="42" rx="7"/>
  <text class="small" x="510" y="676">preview/ · build/</text>
  <rect class="derived" x="702" y="650" width="210" height="42" rx="7"/>
  <text class="small" x="720" y="676">exports/ · paper output</text>
  <text class="small" x="928" y="668">外部来源项目默认只读；</text>
  <text class="small" x="928" y="686">绝对路径与越界资源被拒绝。</text>
</svg>
