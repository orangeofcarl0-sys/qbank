name: quality

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - run: ruff format --check .
      - run: ruff check .
      - run: pyright
      - run: lint-imports
      - run: deptry .
      - run: pytest
      - run: pytest --cov=qbank --cov-branch --cov-fail-under=0 --cov-report=term-missing --cov-report=json:build/audit/coverage.json
      - run: python scripts/check_branch_coverage.py build/audit/coverage.json
      - run: pip check
      - run: pip-audit
      - run: python -m pip wheel . --no-deps --no-build-isolation
      - run: python -m qbank --help
