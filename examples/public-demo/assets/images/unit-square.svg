<svg xmlns="http://www.w3.org/2000/svg" width="360" height="260" viewBox="0 0 360 260" role="img" aria-labelledby="title desc">
  <title id="title">Unit square</title>
  <desc id="desc">A blue square with one-unit labels on its bottom and left sides.</desc>
  <rect width="360" height="260" fill="#f8fafc"/>
  <rect x="95" y="40" width="170" height="170" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <g fill="#1e3a5f" font-family="sans-serif" font-size="18">
    <text x="180" y="238" text-anchor="middle">1 unit</text>
    <text x="55" y="130" text-anchor="middle" transform="rotate(-90 55 130)">1 unit</text>
  </g>
</svg>
